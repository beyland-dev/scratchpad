<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout</title>
<style>body{margin:0;font:16px/1.5 system-ui;background:#f0fdf4;color:#1d2433}.wrap{max-width:960px;margin:0 auto;padding:32px 20px;display:grid;grid-template-columns:1.4fr 1fr;gap:24px}@media(max-width:700px){.wrap{grid-template-columns:1fr}}.card{background:#fff;border-radius:14px;padding:24px;box-shadow:0 1px 3px #0001}h1{font-size:22px;margin:0 0 16px}label{display:block;font-size:13px;color:#5b6475;margin:12px 0 4px}input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid #d5d9e2;border-radius:8px;font:inherit}button{margin-top:20px;width:100%;padding:12px;border:0;border-radius:10px;background:#16a34a;color:#fff;font:600 16px system-ui}.row{display:flex;justify-content:space-between;margin:8px 0}.total{font-weight:700;border-top:1px solid #eee;padding-top:12px}</style></head>
<body><div class="wrap"><div class="card"><h1>Express checkout — updated live</h1><label>Email</label><input placeholder="you@example.com"><label>Address</label><input placeholder="123 Main St"><label>Card number</label><input placeholder="4242 4242 4242 4242"><button onclick="this.textContent='Order placed ✓'">Pay $128.00</button></div>
<div class="card"><h1>Order summary</h1><div class="row"><span>Trail runner ×1</span><span>$110.00</span></div><div class="row"><span>Shipping</span><span>$8.00</span></div><div class="row"><span>Tax</span><span>$10.00</span></div><div class="row total"><span>Total</span><span>$128.00</span></div></div></div></body></html>
