<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inbox One — Agents window homepage</title>
<link rel="stylesheet" href="/s/vscode/system.css" />
<script type="module" src="/s/vscode/system.js"></script>
<script src="data.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #121314; overflow: hidden; }
  #wb {
    position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column;
    background: var(--vscode-agents-background); color: var(--vscode-foreground);
    font-size: var(--vscode-agents-fontSize-body1);
  }
  /* border-box only on prototype-owned elements: VS Code widgets rely on content-box */
  :is(.cc, .avatar, .rail, .new-btn, .nav-item, .pill, .list, .search, .chip, .row, .tag, .row-actions, .rd-h, .thread, .bubble, .cmd, .composer, .compose, .starter, .toast) { box-sizing: border-box; }
  #wb button { font: inherit; color: inherit; }
  .muted { color: var(--vscode-descriptionForeground); }
  .grow { flex: 1; }
  code, .mono { font-family: var(--monaco-monospace-font, ui-monospace, "SF Mono", Menlo, Consolas, monospace); font-size: 12px; }
  code { padding: 1px 4px; border-radius: var(--vscode-cornerRadius-small); background: var(--vscode-textPreformat-background); }

  /* Title bar */
  .tb { height: 38px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 10px; }
  .tb-title { font-weight: 600; font-size: 12px; display: flex; align-items: center; gap: 6px; }
  .tb-center { position: absolute; left: 50%; transform: translateX(-50%); }
  .cc { width: 380px; height: 26px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: var(--vscode-cornerRadius-medium);
        border: 1px solid var(--vscode-commandCenter-border); background: var(--vscode-commandCenter-background); color: var(--vscode-commandCenter-foreground); cursor: text; }
  .cc span { flex: 1; text-align: center; font-size: 12px; }
  .kbd { font-size: 11px; padding: 0 4px; line-height: 16px; border-radius: 3px; border: 1px solid var(--vscode-keybindingLabel-border); border-bottom-color: var(--vscode-keybindingLabel-bottomBorder);
         background: var(--vscode-keybindingLabel-background); color: var(--vscode-keybindingLabel-foreground); }
  .avatar { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 600;
            background: var(--vscode-chat-avatarBackground); color: var(--vscode-chat-avatarForeground); border: 1px solid var(--vscode-agentsCard-border); }

  /* Body / floating panels */
  .body { flex: 1; min-height: 0; display: flex; gap: var(--vscode-agents-layout-floatingPanelGap); padding: 0 6px 6px 0; }
  .card { background: var(--vscode-agentsPanel-background); color: var(--vscode-agentsPanel-foreground); border: 1px solid var(--vscode-agentsPanel-border);
          border-radius: var(--vscode-cornerRadius-large); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

  /* Rail */
  .rail { width: 228px; flex: none; display: flex; flex-direction: column; padding: 4px 8px 8px; overflow-y: auto; }
  .new-btn { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; margin-bottom: 10px; width: 100%; cursor: pointer;
             border-radius: var(--vscode-cornerRadius-medium); border: 1px solid var(--vscode-agentsNewSessionButton-border);
             background: var(--vscode-agentsNewSessionButton-background); color: var(--vscode-agentsNewSessionButton-foreground); }
  .new-btn:hover { background: var(--vscode-agentsNewSessionButton-hoverBackground); }
  .new-btn .grow { text-align: left; }
  .nav { display: flex; flex-direction: column; gap: 1px; }
  .nav-item { display: flex; align-items: center; gap: 8px; height: 26px; padding: 0 8px; border-radius: var(--vscode-cornerRadius-medium); cursor: pointer; border: 0; background: none; width: 100%; text-align: left; }
  .nav-item:hover { background: var(--vscode-list-hoverBackground); }
  .nav-item.active { background: var(--vscode-list-activeSelectionBackground); color: var(--vscode-list-activeSelectionForeground); font-weight: 600; }
  .nav-item .n { font-size: var(--vscode-agents-fontSize-label2); color: var(--vscode-descriptionForeground); font-weight: 400; }
  .pill { min-width: 18px; height: 16px; padding: 0 5px; border-radius: var(--vscode-cornerRadius-circle); display: inline-grid; place-items: center;
          font-size: var(--vscode-agents-fontSize-label3); font-weight: 600; background: var(--vscode-agentsBadge-background); color: var(--vscode-agentsBadge-foreground); }
  .nav-h { font-size: var(--vscode-agents-fontSize-label2); font-weight: 600; color: var(--vscode-descriptionForeground); padding: 14px 8px 4px; display: flex; align-items: center; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; margin: 0 4px; }
  .rail-foot { margin-top: auto; padding-top: 10px; }

  /* List */
  .list { width: 432px; flex: none; }
  .list-h { padding: 12px 10px 8px 16px; display: flex; align-items: center; gap: 8px; }
  .list-h h1 { margin: 0; font-size: var(--vscode-agents-fontSize-heading2); font-weight: 600; letter-spacing: -0.01em; }
  .search { margin: 0 12px; height: 28px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: var(--vscode-cornerRadius-medium);
            background: var(--vscode-input-background); border: 1px solid var(--vscode-input-border); color: var(--vscode-input-foreground); }
  .search:focus-within { border-color: var(--vscode-focusBorder); }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: inherit; font: inherit; }
  .search input::placeholder { color: var(--vscode-input-placeholderForeground); }
  .chips { display: flex; gap: 6px; padding: 10px 12px 6px; flex-wrap: wrap; }
  .chip { height: 22px; padding: 0 9px; display: inline-flex; align-items: center; gap: 5px; border-radius: var(--vscode-cornerRadius-circle); cursor: pointer;
          border: 1px solid var(--vscode-agentsCard-border); background: transparent; font-size: 12px; }
  .chip:hover { background: var(--vscode-list-hoverBackground); }
  .chip.on { background: var(--vscode-list-activeSelectionBackground); border-color: transparent; color: var(--vscode-list-activeSelectionForeground); }
  .rows { flex: 1; overflow-y: auto; padding: 0 6px 8px; outline: none; }
  .day { position: sticky; top: 0; z-index: 2; background: var(--vscode-agentsPanel-background); font-size: var(--vscode-agents-fontSize-label2); font-weight: 600;
         color: var(--vscode-descriptionForeground); padding: 10px 10px 4px; display: flex; align-items: center; gap: 6px; }
  .row { position: relative; display: grid; grid-template-columns: 18px 1fr; column-gap: 6px; padding: 9px 10px 10px 6px; border-radius: var(--vscode-cornerRadius-medium); cursor: pointer; }
  .row + .row { box-shadow: 0 -1px 0 0 var(--vscode-agentsCard-border); }
  .row:hover, .row:hover + .row { box-shadow: none; }
  .row:hover { background: var(--vscode-list-hoverBackground); }
  .row.sel { background: var(--vscode-list-activeSelectionBackground); color: var(--vscode-list-activeSelectionForeground); box-shadow: none; }
  .row.sel + .row { box-shadow: none; }
  .rows:focus-visible { outline: none; }
  .rows:focus-visible .row.sel { outline: 1px solid var(--vscode-focusBorder); outline-offset: -1px; }
  .status { padding-top: 2px; display: flex; justify-content: center; }
  .udot { width: 8px; height: 8px; border-radius: 50%; margin-top: 4px; background: var(--vscode-agentsBadge-background); }
  .rdot { width: 6px; height: 6px; border-radius: 50%; margin-top: 5px; background: var(--vscode-agentSessionReadIndicator-foreground); }
  .st-input { color: var(--vscode-chat-sessionStateIndicator-needsInputBorder); }
  .st-working { color: var(--vscode-chat-sessionStateIndicator-inProgressBorder); }
  .st-error { color: var(--vscode-errorForeground); }
  .st-done, .tag.st-done { color: var(--vscode-testing-iconPassed); }
  .tag.st-input { color: var(--vscode-chat-sessionStateIndicator-needsInputBorder); }
  .tag.st-working { color: var(--vscode-chat-sessionStateIndicator-inProgressBorder); }
  .tag.st-error { color: var(--vscode-errorForeground); }
  :is(.st-input, .st-working, .st-error, .st-done, .add, .del, .pr-open, .pr-merged) .codicon { color: inherit !important; }
  .r-from { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--vscode-descriptionForeground); min-width: 0; }
  .r-from .codicon, .r-from vsc-icon { font-size: 14px !important; }
  .r-from .t { margin-left: auto; flex: none; font-size: var(--vscode-agents-fontSize-label2); }
  .row.unread .r-from { color: var(--vscode-foreground); }
  .row.unread .r-from .t { color: var(--vscode-foreground); font-weight: 600; }
  .r-title { margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row.unread .r-title { font-weight: 600; }
  .r-prev { margin-top: 2px; font-size: 12px; color: var(--vscode-descriptionForeground); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 17px; }
  .r-prev b { font-weight: 600; }
  .r-meta { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
  .tag { height: 18px; display: inline-flex; align-items: center; gap: 4px; padding: 0 6px; border-radius: var(--vscode-cornerRadius-small); font-size: var(--vscode-agents-fontSize-label2);
         border: 1px solid var(--vscode-agentsCard-border); color: var(--vscode-descriptionForeground); white-space: nowrap; }
  .row.sel .tag { border-color: var(--vscode-agentSessionSelectedBadge-border); }
  .tag .codicon, .tag vsc-icon { font-size: 12px !important; }
  .add { color: var(--vscode-chat-linesAddedForeground); } .del { color: var(--vscode-chat-linesRemovedForeground); }
  .row-actions { position: absolute; right: 6px; top: 5px; display: none; border-radius: var(--vscode-cornerRadius-medium); background: var(--vscode-agentsPanel-background);
                 border: 1px solid var(--vscode-agentsCard-border); padding: 1px; box-shadow: 0 2px 6px var(--vscode-widget-shadow); }
  .row:hover .row-actions { display: flex; }
  .empty { padding: 48px 24px; text-align: center; color: var(--vscode-descriptionForeground); }
  .empty vsc-icon { font-size: 28px !important; display: block; margin-bottom: 8px; }

  /* Reader */
  .reader { flex: 1; min-width: 0; }
  .rd-h { padding: 14px 16px 12px 24px; border-bottom: 1px solid var(--vscode-agentsPanel-border); }
  .rd-top { display: flex; align-items: flex-start; gap: 12px; }
  .rd-top h2 { margin: 0; font-size: var(--vscode-agents-fontSize-heading2); font-weight: 600; line-height: 1.3; flex: 1; min-width: 0; }
  .rd-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .scroll { flex: 1; overflow-y: auto; }
  .thread { max-width: 780px; margin: 0 auto; padding: 18px 24px 28px; display: flex; flex-direction: column; gap: 18px; }
  .msg-h { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .msg-h b { font-weight: 600; }
  .msg-h .avatar { width: 24px; height: 24px; }
  .bubble { background: var(--vscode-chat-requestBubbleBackground); border-radius: var(--vscode-cornerRadius-xLarge); padding: 9px 13px; line-height: 1.5; margin-left: 32px; }
  .msg-body { margin-left: 32px; line-height: 1.55; }
  .msg-body p { margin: 0 0 10px; }
  .box { border: 1px solid var(--vscode-agentsCard-border); border-radius: var(--vscode-cornerRadius-large); overflow: hidden; margin-top: 12px; }
  .box-h { display: flex; align-items: center; gap: 8px; padding: 8px 12px; font-weight: 600; background: var(--vscode-chat-statusBackground); }
  .box-h .muted { font-weight: 400; }
  .file { display: flex; align-items: center; gap: 8px; padding: 5px 12px; font-size: 12px; cursor: pointer; }
  .file:hover { background: var(--vscode-list-hoverBackground); }
  .file .path { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file .mono { font-size: 11px; }
  .q { border-left: 3px solid var(--vscode-chat-sessionStateIndicator-needsInputBorder); }
  .q .box-h { background: transparent; padding-top: 10px; }
  .q-body { padding: 0 12px 12px; }
  .cmd { display: block; padding: 8px 10px; margin-bottom: 10px; background: var(--vscode-textCodeBlock-background); border-radius: var(--vscode-cornerRadius-medium); }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .opts vsc-button { width: auto; }
  .step { display: flex; align-items: center; gap: 8px; padding: 5px 12px; }
  .step.todo { color: var(--vscode-descriptionForeground); }
  .bar { height: 2px; background: var(--vscode-agentsCard-border); }
  .bar > i { display: block; height: 100%; background: var(--vscode-progressBar-background); }
  .checks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .pr { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
  .pr .grow { min-width: 0; }
  .pr-open { color: var(--vscode-charts-green); } .pr-merged { color: var(--vscode-charts-purple); }
  a.link { color: var(--vscode-textLink-foreground); text-decoration: none; cursor: pointer; }
  a.link:hover { text-decoration: underline; }
  .divider { display: flex; align-items: center; gap: 10px; color: var(--vscode-descriptionForeground); font-size: var(--vscode-agents-fontSize-label2); }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--vscode-agentsCard-border); }
  .composer { flex: none; padding: 4px 24px 14px; }
  .composer > div { max-width: 780px; margin: 0 auto; }
  .composer vsc-chat-view, .compose vsc-chat-view { background: transparent; height: auto; }

  /* Compose */
  .compose { flex: 1; overflow-y: auto; display: flex; flex-direction: column; align-items: center; padding: 10vh 32px 32px; }
  .compose > div { width: 100%; max-width: 680px; }
  .compose h2 { margin: 0 0 6px; font-size: var(--vscode-agents-fontSize-heading1); font-weight: 600; letter-spacing: -0.01em; }
  .fields { display: grid; grid-template-columns: 84px 1fr; row-gap: 2px; margin: 18px 0 12px; border-top: 1px solid var(--vscode-agentsCard-border); }
  .fields > * { padding: 7px 0; border-bottom: 1px solid var(--vscode-agentsCard-border); display: flex; align-items: center; gap: 6px; }
  .fields .k { color: var(--vscode-descriptionForeground); font-size: 12px; }
  .seg { display: flex; gap: 4px; flex-wrap: wrap; }
  .starters { margin-top: 22px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .starter { text-align: left; padding: 10px 12px; border-radius: var(--vscode-cornerRadius-large); border: 1px solid var(--vscode-agentsCard-border); background: transparent; cursor: pointer; line-height: 1.4; display: flex; gap: 10px; }
  .starter:hover { background: var(--vscode-list-hoverBackground); }
  .starter small { display: block; color: var(--vscode-descriptionForeground); font-size: 12px; margin-top: 2px; }

  /* Toast */
  .toast { position: absolute; left: 50%; bottom: 22px; transform: translate(-50%, 20px); opacity: 0; transition: .18s ease; pointer-events: none; z-index: 10;
           display: flex; align-items: center; gap: 14px; padding: 8px 10px 8px 14px; border-radius: var(--vscode-cornerRadius-large);
           background: var(--vscode-notifications-background); color: var(--vscode-notifications-foreground); border: 1px solid var(--vscode-notificationToast-border, var(--vscode-widget-border));
           box-shadow: 0 4px 16px var(--vscode-widget-shadow); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }

  @media (max-width: 1180px) { .rail { width: 52px; } .rail .lbl, .rail .n, .rail .nav-h, .rail .kbd, .rail .pill { display: none; } .new-btn { justify-content: center; padding: 0; } .nav-item { justify-content: center; } }
</style>
</head>
<body>
<vsc-workbench id="wb" theme="dark-2026">
  <header class="tb">
    <vsc-toolbar label="Window"><vsc-action icon="layout-sidebar-left" label="Toggle Sidebar" checked></vsc-action></vsc-toolbar>
    <div class="tb-title"><vsc-icon name="copilot"></vsc-icon>Agents</div>
    <div class="tb-center"><div class="cc" id="cc"><vsc-icon name="search"></vsc-icon><span>Search sessions, workspaces and commands</span><span class="kbd" style="flex:none">⌘P</span></div></div>
    <div class="grow"></div>
    <vsc-toolbar label="Global"><vsc-action icon="bell" label="Notifications"></vsc-action></vsc-toolbar>
    <div class="avatar" title="hawkticehurst">HT</div>
  </header>
  <div class="body">
    <nav class="rail" id="rail" aria-label="Mailboxes"></nav>
    <section class="card list" aria-label="Sessions">
      <div class="list-h">
        <h1 id="list-title">Inbox</h1><span class="muted" id="list-count"></span>
        <div class="grow"></div>
        <vsc-toolbar label="List actions">
          <vsc-action icon="check-all" label="Mark All as Read" id="mark-all"></vsc-action>
          <vsc-action icon="list-filter" label="Filter"></vsc-action>
          <vsc-action icon="toolbar-more" label="More Actions..."></vsc-action>
        </vsc-toolbar>
      </div>
      <label class="search"><vsc-icon name="search"></vsc-icon><input id="q" placeholder="Search sessions" autocomplete="off" /><span class="kbd">/</span></label>
      <div class="chips" id="chips"></div>
      <div class="rows" id="rows" tabindex="0" role="listbox" aria-label="Sessions"></div>
    </section>
    <section class="card reader" id="reader" aria-live="polite"></section>
  </div>
  <div class="toast" id="toast" role="status"><span id="toast-text"></span><a class="link" id="toast-undo">Undo</a></div>
</vsc-workbench>

<script type="module">
const D = window.INBOX_DATA;
const H = D.harnesses;
const WS = Object.fromEntries(D.workspaces.map(w => [w.id, w]));
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const md = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>");
const icon = (n, extra = "") => `<vsc-icon name="${n}"${extra}></vsc-icon>`;

const wb = $("#wb");

const state = { box: "inbox", chip: "all", q: "", sel: "s1", compose: false, sessions: D.sessions.map(s => ({ ...s })), seq: 100 };

const MAILBOXES = [
  { id: "inbox", label: "Inbox", icon: "inbox", test: s => s.state !== "done" },
  { id: "input", label: "Needs input", icon: "comment-unresolved", test: s => s.state === "input" },
  { id: "working", label: "In progress", icon: "session-in-progress", test: s => s.state === "working" },
  { id: "pinned", label: "Pinned", icon: "pinned", test: s => s.pinned },
  { id: "done", label: "Done", icon: "archive", test: s => s.state === "done" },
];
const boxTest = (id) => {
  const m = MAILBOXES.find(b => b.id === id);
  if (m) return m.test;
  const [kind, key] = id.split(":");
  return kind === "ws" ? (s => s.workspace === key && s.state !== "done") : (s => s.group === key && s.state !== "done");
};
const boxLabel = (id) => MAILBOXES.find(b => b.id === id)?.label || (id.startsWith("ws:") ? WS[id.slice(3)].label : D.groups.find(g => "group:" + g.id === id).label);
const CHIPS = [
  { id: "all", label: "All" },
  { id: "unread", label: "Unread", test: s => s.unread },
  { id: "input", label: "Needs input", test: s => s.state === "input" },
  { id: "pr", label: "Has PR", test: s => !!s.pr },
];

function visible() {
  const t = boxTest(state.box), c = CHIPS.find(x => x.id === state.chip).test || (() => true), q = state.q.toLowerCase();
  return state.sessions.filter(s => t(s) && c(s) && (!q || [s.title, s.preview, s.branch, WS[s.workspace].label, H[s.harness].label].join(" ").toLowerCase().includes(q)));
}

function statusIcon(s) {
  if (s.state === "input") return `<span class="st-input" title="Needs input">${icon("comment-unresolved")}</span>`;
  if (s.state === "working") return `<span class="st-working" title="In progress">${icon("loading", " spin")}</span>`;
  if (s.state === "error") return `<span class="st-error" title="Failed">${icon("error")}</span>`;
  if (s.state === "done") return `<span class="st-done" title="Done">${icon("pass")}</span>`;
  return s.unread ? `<span class="udot" title="Unread"></span>` : `<span class="rdot" title="Read"></span>`;
}
const diffStat = (s) => { const a = s.files.reduce((n, f) => n + f[1], 0), d = s.files.reduce((n, f) => n + f[2], 0); return { a, d, n: s.files.length }; };
function metaTags(s) {
  const out = [];
  if (s.state === "input") out.push(`<span class="tag st-input">${icon("comment-unresolved")}Needs input</span>`);
  if (s.state === "working") { const d = s.steps.filter(x => x[1] === "done").length; out.push(`<span class="tag st-working">Working · ${d + 1}/${s.steps.length}</span>`); }
  if (s.state === "error") out.push(`<span class="tag st-error">${icon("error")}Build failed</span>`);
  if (s.pr) out.push(`<span class="tag"><span class="${s.pr.status === "Merged" ? "pr-merged" : "pr-open"}">${icon("git-pull-request")}</span>#${s.pr.num}</span>`);
  const { a, d, n } = diffStat(s);
  if (n) out.push(`<span class="tag">${n} file${n > 1 ? "s" : ""} <span class="add">+${a}</span><span class="del">−${d}</span></span>`);
  if (s.pinned) out.push(`<span class="tag">${icon("pinned")}</span>`);
  return out.join("");
}

function renderRail() {
  const count = (t) => state.sessions.filter(t).length;
  const unread = state.sessions.filter(s => s.state !== "done" && s.unread).length;
  const item = (id, ic, label, right) => `<button class="nav-item ${state.box === id && !state.compose ? "active" : ""}" data-box="${id}" title="${esc(label)}">${ic}<span class="lbl grow">${esc(label)}</span>${right || ""}</button>`;
  $("#rail").innerHTML = `
    <button class="new-btn" id="new-btn" title="New Session (C)">${icon("new-session")}<span class="lbl grow">New Session</span><span class="kbd">C</span></button>
    <div class="nav">${MAILBOXES.map(b => item(b.id, icon(b.icon), b.label,
      b.id === "inbox" ? (unread ? `<span class="pill">${unread}</span>` : "") : `<span class="n">${count(b.test) || ""}</span>`)).join("")}</div>
    <div class="nav-h"><span class="grow">Workspaces</span></div>
    <div class="nav">${D.workspaces.map(w => item("ws:" + w.id, `<span class="dot" style="background:${w.color}"></span>`, w.label, `<span class="n">${count(boxTest("ws:" + w.id)) || ""}</span>`)).join("")}</div>
    <div class="nav-h"><span class="grow">Groups</span></div>
    <div class="nav">${D.groups.map(g => item("group:" + g.id, icon("folder"), g.label, `<span class="n">${count(boxTest("group:" + g.id)) || ""}</span>`)).join("")}</div>
    <div class="rail-foot nav">${item("x-auto", icon("history"), "Automations")}${item("x-custom", icon("settings-gear"), "Customizations")}</div>`;
}

function renderChips() {
  $("#chips").innerHTML = CHIPS.map(c => `<button class="chip ${state.chip === c.id ? "on" : ""}" data-chip="${c.id}">${c.label}</button>`).join("");
}

function rowHtml(s) {
  const h = H[s.harness], w = WS[s.workspace];
  const prev = s.state === "input" ? `<b class="st-input">${esc(s.question.text)}</b> ${md(s.preview)}` : md(s.preview);
  return `<div class="row ${s.unread ? "unread" : ""} ${state.sel === s.id && !state.compose ? "sel" : ""}" data-id="${s.id}" role="option" aria-selected="${state.sel === s.id}">
    <div class="status">${statusIcon(s)}</div>
    <div style="min-width:0">
      <div class="r-from">${icon(h.icon)}<span>${h.label}</span><span class="muted">·</span><span class="dot" style="background:${w.color};margin:0 0 0 1px;width:6px;height:6px"></span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${w.label}</span><span class="t">${s.time}</span></div>
      <div class="r-title">${md(s.title)}</div>
      <div class="r-prev">${prev}</div>
      <div class="r-meta">${metaTags(s)}</div>
    </div>
    <div class="row-actions"><vsc-toolbar label="Session actions">
      <vsc-action icon="${s.pinned ? "pinned" : "pin"}" label="${s.pinned ? "Unpin" : "Pin"} (P)" data-act="pin"></vsc-action>
      <vsc-action icon="${s.unread ? "mail-read" : "mail"}" label="Mark as ${s.unread ? "Read" : "Unread"} (U)" data-act="unread"></vsc-action>
      <vsc-action icon="${s.state === "done" ? "inbox" : "archive"}" label="${s.state === "done" ? "Move to Inbox" : "Mark as Done (E)"}" data-act="done"></vsc-action>
    </vsc-toolbar></div>
  </div>`;
}

function renderList() {
  const list = visible();
  $("#list-title").textContent = boxLabel(state.box);
  const unread = list.filter(s => s.unread).length;
  $("#list-count").textContent = `${list.length} session${list.length === 1 ? "" : "s"}${unread ? ` · ${unread} unread` : ""}`;
  if (!list.length) {
    $("#rows").innerHTML = `<div class="empty">${icon(state.box === "inbox" ? "check-all" : "inbox")}${state.q ? "No sessions match your search." : state.box === "inbox" ? "Inbox zero. Every agent is either done or waiting for a new task." : "Nothing here."}</div>`;
    return;
  }
  const sections = [];
  const pinned = state.box === "inbox" ? list.filter(s => s.pinned) : [];
  if (pinned.length) sections.push(["Pinned", pinned]);
  for (const s of list) {
    if (pinned.includes(s)) continue;
    const day = s.state === "input" && state.box === "inbox" ? "Needs your input" : s.day;
    let sec = sections.find(x => x[0] === day);
    if (!sec) sections.push(sec = [day, []]);
    sec[1].push(s);
  }
  sections.sort((a, b) => (b[0] === "Needs your input") - (a[0] === "Needs your input") || (b[0] === "Pinned") - (a[0] === "Pinned"));
  $("#rows").innerHTML = sections.map(([day, items]) => `<div class="day">${day === "Pinned" ? icon("pinned") : day === "Needs your input" ? `<span class="st-input">${icon("comment-unresolved")}</span>` : ""}${day}<span class="grow"></span><span style="font-weight:400">${items.length}</span></div>${items.map(rowHtml).join("")}`).join("");
}

function filesBox(s) {
  const { a, d, n } = diffStat(s);
  if (!n) return "";
  return `<div class="box"><div class="box-h">${icon("diff")}${n} file${n > 1 ? "s" : ""} changed <span class="add mono">+${a}</span><span class="del mono">−${d}</span><span class="grow"></span><a class="link" style="font-weight:400">Review changes</a></div>
    ${s.files.map(([p, fa, fd]) => { const i = p.lastIndexOf("/"); return `<div class="file">${icon("file")}<span class="path">${esc(p.slice(i + 1))} <span class="muted">${esc(p.slice(0, i + 1))}</span></span><span class="mono add">+${fa}</span><span class="mono del">−${fd}</span></div>`; }).join("")}</div>`;
}
function checksRow(s) {
  if (!s.checks || !s.checks.length) return "";
  const ic = { pass: `<span class="st-done">${icon("pass")}</span>`, fail: `<span class="st-error">${icon("error")}</span>`, pending: `<span class="st-working">${icon("loading", " spin")}</span>` };
  return `<div class="checks">${s.checks.map(([l, st]) => `<span class="tag" style="height:22px;color:var(--vscode-foreground)">${ic[st]}${esc(l)}</span>`).join("")}</div>`;
}
function prBox(s) {
  if (!s.pr) return "";
  const merged = s.pr.status === "Merged";
  return `<div class="box"><div class="pr"><span class="${merged ? "pr-merged" : "pr-open"}">${icon(merged ? "git-merge" : "git-pull-request")}</span>
    <div class="grow"><div style="font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(s.pr.title)} <span class="muted" style="font-weight:400">#${s.pr.num}</span></div><div class="muted" style="font-size:12px">${WS[s.workspace].repo} · ${esc(s.branch)}</div></div>
    <span class="tag ${merged ? "pr-merged" : "pr-open"}">${s.pr.status}</span><a class="link">${icon("link-external")}</a></div></div>`;
}
function agentPart(s) {
  if (s.state === "working") {
    const done = s.steps.filter(x => x[1] === "done").length;
    return `<div class="box"><div class="box-h"><span class="st-working">${icon("loading", " spin")}</span>Working <span class="muted">step ${done + 1} of ${s.steps.length}</span><span class="grow"></span><vsc-toolbar label="Run"><vsc-action icon="debug-stop" label="Stop"></vsc-action></vsc-toolbar></div>
      <div class="bar"><i style="width:${Math.round((done + 0.5) / s.steps.length * 100)}%"></i></div>
      <div style="padding:4px 0">${s.steps.map(([l, st]) => `<div class="step ${st}">${st === "done" ? `<span class="st-done">${icon("pass")}</span>` : st === "active" ? `<span class="st-working">${icon("loading", " spin")}</span>` : icon("circle-large-outline")}${md(l)}</div>`).join("")}</div></div>`;
  }
  let html = (s.body || []).map(p => `<p>${p}</p>`).join("");
  if (s.state === "input") {
    html += `<div class="box q"><div class="box-h"><span class="st-input">${icon("comment-unresolved")}</span>${esc(s.question.text)}</div><div class="q-body">
      ${s.question.command ? `<code class="cmd">$ ${esc(s.question.command)}</code>` : ""}
      <div class="opts">${s.question.options.map((o, i) => `<vsc-button ${i ? "secondary" : ""} data-answer="${esc(o)}">${esc(o)}</vsc-button>`).join("")}</div></div></div>`;
  }
  return html;
}

function renderReader() {
  const el = $("#reader");
  if (state.compose) return renderCompose(el);
  const s = state.sessions.find(x => x.id === state.sel);
  if (!s) { el.innerHTML = `<div class="empty" style="margin:auto">${icon("mail")}Select a session to read it.</div>`; return; }
  const h = H[s.harness], w = WS[s.workspace];
  const envIcon = { Cloud: "cloud", Worktree: "worktree", Local: "vm" }[s.env];
  const stateTag = { input: `<span class="tag st-input">${icon("comment-unresolved")}Needs input</span>`, working: `<span class="tag st-working">${icon("loading", " spin")}In progress</span>`, error: `<span class="tag st-error">${icon("error")}Failed</span>`, review: `<span class="tag st-done">${icon("pass")}Ready for review</span>`, done: `<span class="tag st-done">${icon("pass")}Done</span>` }[s.state];
  el.innerHTML = `
    <div class="rd-h">
      <div class="rd-top"><h2>${md(s.title)}</h2>
        <vsc-toolbar label="Session">
          <vsc-action icon="${s.pinned ? "pinned" : "pin"}" label="${s.pinned ? "Unpin" : "Pin"} (P)" data-act="pin"></vsc-action>
          <vsc-action icon="${s.unread ? "mail-read" : "mail"}" label="Mark as ${s.unread ? "Read" : "Unread"} (U)" data-act="unread"></vsc-action>
          <vsc-action icon="${s.state === "done" ? "inbox" : "archive"}" label="${s.state === "done" ? "Move to Inbox" : "Mark as Done (E)"}" data-act="done"></vsc-action>
          <vsc-action icon="go-to-file" label="Open Session in Chat"></vsc-action>
          <vsc-action icon="toolbar-more" label="More Actions..."></vsc-action>
        </vsc-toolbar></div>
      <div class="rd-meta">${stateTag}<span class="tag"><span class="dot" style="background:${w.color};margin:0;width:6px;height:6px"></span>${w.label}</span><span class="tag">${icon("git-branch")}${esc(s.branch)}</span><span class="tag">${icon(envIcon)}${s.env}</span></div>
    </div>
    <div class="scroll"><div class="thread">
      <div><div class="msg-h"><div class="avatar">HT</div><b>You</b><span class="muted">to ${h.label}</span></div><div class="bubble">${md(s.prompt)}</div></div>
      ${(s.replies || []).map(r => `<div><div class="msg-h"><div class="avatar">HT</div><b>You</b><span class="muted">just now</span></div><div class="bubble">${esc(r)}</div></div>`).join("")}
      <div><div class="msg-h"><div class="avatar">${icon(h.icon)}</div><b>${h.label}</b><span class="muted">${s.model} · ${s.time}</span></div>
        <div class="msg-body">${agentPart(s)}${filesBox(s)}${checksRow(s)}${prBox(s)}</div></div>
    </div></div>
    <div class="composer"><div><vsc-chat-view><vsc-chat-input placeholder="Reply to ${h.label}…" no-secondary>
      <vsc-action slot="toolbar" menu icon="add-compact" label="Add Context..."></vsc-action>
      <vsc-chat-picker slot="toolbar" kind="mode" icon="agent-compact" label="Agent"></vsc-chat-picker>
      <vsc-chat-model-picker slot="toolbar" label="${s.model}"></vsc-chat-model-picker>
    </vsc-chat-input></vsc-chat-view></div></div>`;
  wireComposer(el, (text) => reply(s, text));
}

function renderCompose(el) {
  const starters = [
    ["bug", "Fix the top Insiders crash", "From last night's error telemetry"],
    ["issues", "Triage new agents-window issues", "Label, dedupe and assign"],
    ["git-pull-request", "Review PR #284112", "Unread badge on sidebar toggle"],
    ["beaker", "Add tests for SessionsList grouping", "Cover repository and date modes"],
  ];
  el.innerHTML = `<div class="compose"><div>
    <h2>New session</h2><div class="muted">Describe a task. The agent works in the background and reports back to your inbox.</div>
    <div class="fields">
      <span class="k">Workspace</span><div class="seg" id="f-ws">${D.workspaces.map((w, i) => `<button class="chip ${i ? "" : "on"}" data-ws="${w.id}"><span class="dot" style="background:${w.color};margin:0;width:6px;height:6px"></span>${w.label}</button>`).join("")}</div>
      <span class="k">Agent</span><div class="seg" id="f-h">${Object.entries(H).map(([k, h], i) => `<button class="chip ${i ? "" : "on"}" data-h="${k}">${icon(h.icon)}${h.label}</button>`).join("")}</div>
    </div>
    <vsc-chat-view><vsc-chat-input id="compose-input" placeholder="Describe what to build"></vsc-chat-input></vsc-chat-view>
    <div class="starters">${starters.map(([ic, t, d]) => `<button class="starter" data-starter="${esc(t)}">${icon(ic)}<span>${esc(t)}<small>${esc(d)}</small></span></button>`).join("")}</div>
  </div></div>`;
  for (const id of ["#f-ws", "#f-h"]) el.querySelector(id).addEventListener("click", (e) => {
    const b = e.target.closest(".chip"); if (!b) return;
    el.querySelectorAll(id + " .chip").forEach(c => c.classList.toggle("on", c === b));
  });
  el.querySelectorAll("[data-starter]").forEach(b => b.addEventListener("click", () => setComposerText(el, b.dataset.starter)));
  wireComposer(el, (text) => {
    const ws = el.querySelector("#f-ws .on").dataset.ws, harness = el.querySelector("#f-h .on").dataset.h;
    const id = "n" + state.seq++;
    state.sessions.unshift({
      id, state: "working", unread: false, time: "now", day: "Today", title: text.length > 64 ? text.slice(0, 62) + "…" : text,
      harness, model: harness === "codex" ? "GPT-6-Codex" : harness === "claude" ? "Claude Sonnet 5" : "Auto", workspace: ws, env: harness === "cloud" ? "Cloud" : "Worktree",
      branch: "agents/" + text.toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 28).replace(/-$/, ""), prompt: text, preview: "Planning…",
      steps: [["Understand the task and explore the codebase", "active"], ["Make the change", "todo"], ["Run tests and hygiene", "todo"]], files: [],
    });
    state.compose = false; state.box = "inbox"; state.chip = "all"; state.sel = id;
    render(); toast("Session started. You'll be notified in your inbox when it needs you.");
  });
  setTimeout(() => el.querySelector(".dt-editor-text")?.focus(), 50);
}

function setComposerText(root, text) {
  const ed = root.querySelector(".dt-editor-text"); if (!ed) return;
  ed.textContent = text; ed.dispatchEvent(new Event("input")); ed.focus();
  const r = document.createRange(); r.selectNodeContents(ed); r.collapse(false); getSelection().removeAllRanges(); getSelection().addRange(r);
}
function wireComposer(root, onSend) {
  customElements.whenDefined("vsc-chat-input").then(() => requestAnimationFrame(() => {
    const ed = root.querySelector(".dt-editor-text"), submit = root.querySelector("vsc-chat-submit");
    if (!ed) return;
    const send = () => { const t = ed.textContent.trim(); if (t) onSend(t); };
    ed.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
    submit?.addEventListener("click", send);
  }));
}

function reply(s, text) {
  s.replies = [...(s.replies || []), text];
  s.state = "working"; s.unread = false; s.time = "now"; s.day = "Today"; s.preview = "Working on your reply…";
  s.steps = [["Read your reply", "done"], ["Continue the task", "active"], ["Run tests and hygiene", "todo"]];
  render();
  toast(`Sent to ${H[s.harness].label}.`);
}

let undo = null, toastTimer;
function toast(text, undoFn) {
  undo = undoFn || null;
  $("#toast-text").textContent = text; $("#toast-undo").style.display = undo ? "" : "none";
  $("#toast").classList.add("show"); clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("#toast").classList.remove("show"), 4000);
}
$("#toast-undo").addEventListener("click", () => { undo?.(); undo = null; $("#toast").classList.remove("show"); render(); });

function act(s, a) {
  if (a === "pin") s.pinned = !s.pinned;
  if (a === "unread") s.unread = !s.unread;
  if (a === "done") {
    const prev = s.state;
    if (prev === "done") { s.state = "review"; toast("Moved to Inbox."); }
    else {
      const list = visible(), i = list.indexOf(s);
      s.state = "done"; s.unread = false;
      if (state.sel === s.id) state.sel = (list[i + 1] || list[i - 1] || {}).id;
      toast("Marked as done.", () => { s.state = prev; state.sel = s.id; });
    }
  }
  render();
}

function select(id) {
  state.sel = id; state.compose = false;
  const s = state.sessions.find(x => x.id === id);
  if (s && s.unread && s.state !== "working") s.unread = false;
  render();
  $(`.row[data-id="${id}"]`)?.scrollIntoView({ block: "nearest" });
}

function render() { renderRail(); renderChips(); renderList(); renderReader(); }

$("#rail").addEventListener("click", (e) => {
  if (e.target.closest("#new-btn")) { state.compose = true; render(); return; }
  const b = e.target.closest("[data-box]"); if (!b || b.dataset.box.startsWith("x-")) return;
  state.box = b.dataset.box; state.compose = false; const first = visible()[0]; if (first && !visible().some(s => s.id === state.sel)) state.sel = first.id; render();
});
$("#chips").addEventListener("click", (e) => { const b = e.target.closest("[data-chip]"); if (b) { state.chip = b.dataset.chip; render(); } });
$("#q").addEventListener("input", (e) => { state.q = e.target.value; renderList(); });
$("#rows").addEventListener("click", (e) => {
  const row = e.target.closest(".row"); if (!row) return;
  const a = e.target.closest("[data-act]");
  const s = state.sessions.find(x => x.id === row.dataset.id);
  if (a) { e.stopPropagation(); act(s, a.dataset.act); return; }
  select(s.id);
});
$("#reader").addEventListener("click", (e) => {
  const s = state.sessions.find(x => x.id === state.sel);
  const a = e.target.closest("[data-act]"); if (a && s) { act(s, a.dataset.act); return; }
  const ans = e.target.closest("[data-answer]"); if (ans && s) reply(s, ans.dataset.answer);
});
$("#mark-all").addEventListener("click", () => { visible().forEach(s => s.unread = false); render(); toast("Marked all as read."); });
$("#cc").addEventListener("click", () => $("#q").focus());

document.addEventListener("keydown", (e) => {
  if (e.target.closest("input, [contenteditable]") || e.metaKey || e.ctrlKey || e.altKey) { if (e.key === "Escape") e.target.blur?.(); return; }
  const list = visible(), i = list.findIndex(s => s.id === state.sel), s = list[i];
  const k = e.key;
  if (k === "j" || k === "ArrowDown") { e.preventDefault(); if (list[i + 1]) select(list[i + 1].id); }
  else if (k === "k" || k === "ArrowUp") { e.preventDefault(); if (list[i - 1]) select(list[i - 1].id); }
  else if (k === "e" && s) act(s, "done");
  else if (k === "u" && s) act(s, "unread");
  else if (k === "p" && s) act(s, "pin");
  else if (k === "c") { state.compose = true; render(); }
  else if (k === "r" && s) { e.preventDefault(); $("#reader .dt-editor-text")?.focus(); }
  else if (k === "/") { e.preventDefault(); $("#q").focus(); }
  else if (k === "Escape" && state.compose) { state.compose = false; render(); }
});

const s0 = state.sessions.find(s => s.id === state.sel);
render();
</script>
</body>
</html>
