name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            os: macos-14
            command: dist:mac
            arch: arm64
            artifact: macos-arm64
            path: apps/desktop/release/*-mac-arm64.dmg
          - name: macOS Intel
            os: macos-14
            command: dist:mac
            arch: x64
            artifact: macos-x64
            path: apps/desktop/release/*-mac-x64.dmg
          - name: Windows x64
            os: windows-2022
            command: dist:win
            artifact: windows-x64
            path: apps/desktop/release/*.exe
          - name: Linux AppImage
            os: ubuntu-24.04
            command: dist:linux:appimage
            artifact: linux-appimage
            path: apps/desktop/release/*.AppImage
          - name: Linux .deb
            os: ubuntu-24.04
            command: dist:linux:deb
            artifact: linux-deb
            path: apps/desktop/release/*.deb
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      SPRUE_MAC_ARCHS: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @beyland/sprue-desktop ${{ matrix.command }}
      - uses: actions/upload-artifact@v7
        with:
          name: sprue-${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
