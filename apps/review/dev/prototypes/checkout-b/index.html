<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout B</title>
    <style>
      body {
        margin: 0;
        font:
          15px/1.5 system-ui,
          sans-serif;
        color: #222;
        background: #fff;
      }
      header {
        padding: 16px 24px;
        border-bottom: 1px solid #eee;
        font-weight: 700;
      }
      ol {
        display: flex;
        gap: 8px;
        list-style: none;
        padding: 0;
        margin: 24px auto;
        max-width: 560px;
      }
      ol li {
        flex: 1;
        padding: 8px;
        text-align: center;
        border-radius: 999px;
        background: #eee;
        font-size: 13px;
      }
      ol li.on {
        background: #111;
        color: #fff;
      }
      main {
        max-width: 560px;
        margin: 0 auto;
        padding: 0 24px 48px;
      }
      button {
        width: 100%;
        padding: 14px;
        margin-top: 10px;
        border-radius: 10px;
        border: 1px solid #ddd;
        background: #fafafa;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      button:focus {
        outline: 2px solid #111;
      }
    </style>
  </head>
  <body>
    <header>Storefront</header>
    <ol>
      <li>Shipping</li>
      <li class="on">Payment</li>
      <li>Review</li>
    </ol>
    <main>
      <h1>How would you like to pay?</h1>
      <button type="button">Credit or debit card</button>
      <button type="button">PayPal</button>
      <button type="button">Gift card</button>
    </main>
  </body>
</html>
